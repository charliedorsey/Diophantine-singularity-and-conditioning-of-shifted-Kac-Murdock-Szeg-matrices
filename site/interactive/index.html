<style>
  :root{
    --serif:Georgia,"Times New Roman",serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --paper:#f4f1ec; --paper-2:#ebe6dd; --ink:#1f1c18; --ink-2:#4a463f; --mute:#7a746a;
    --rule:#d8d1c5; --rule-2:#c4bcad;
    --slate:#3d5670; --slate-soft:rgba(61,86,112,.18);
    --red:#a8321c; --red-soft:rgba(168,50,28,.14);
    --moss:#4e6b3f;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#171416; --paper-2:#211d20; --ink:#f2e7d8; --ink-2:#d4cac4; --mute:#aa9f99;
    --rule:#3d3639; --rule-2:#61565b;
    --slate:#8db5d0; --slate-soft:rgba(141,181,208,.18);
    --red:#ff775e; --red-soft:rgba(255,119,94,.15);
    --moss:#8dbb78;
  }
  *{box-sizing:border-box}
  html{background:var(--paper)}
  body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--serif);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:3px}
  a:hover{color:var(--red)}
  .wrap{max-width:1180px;margin:0 auto;padding:clamp(18px,3.5vw,44px) clamp(16px,4vw,48px) 80px}

  /* masthead */
  .mast{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--rule);font-size:15px;color:var(--ink-2);flex-wrap:wrap}
  .mast .brand{font-weight:500;color:var(--ink);text-decoration:none;font-size:17px}
  .mast .crumb{color:var(--mute)}
  .mast .crumb b{color:var(--ink-2);font-weight:400}
  .mast-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
  .mast-actions a{text-decoration:none;color:var(--ink-2)}
  .pill{font:500 13px var(--mono);color:var(--ink);background:transparent;border:1px solid var(--rule-2);border-radius:999px;padding:6px 10px;cursor:pointer}
  .pill:hover{border-color:var(--slate);color:var(--slate)}
  .pill:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
  .pill.kid[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* hero */
  .hero{padding:54px 0 30px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px;align-items:end}
  h1{font-family:var(--serif);font-weight:300;font-size:clamp(44px,7.2vw,92px);line-height:.98;letter-spacing:-.022em;margin:0}
  .dek{margin:22px 0 0;font-size:clamp(19px,2.2vw,23px);line-height:1.4;font-weight:300;color:var(--ink-2);max-width:34ch}
  .dek i{font-style:italic;color:var(--ink)}
  .paper{font-size:15.5px;color:var(--mute);line-height:1.5}
  .paper i{color:var(--ink-2)}
  .paper .who{margin-top:8px}
  hr.rule{border:0;border-top:1px solid var(--rule);margin:0}

  /* instrument */
  .inst{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:0;border:1px solid var(--rule-2);margin-top:34px;background:var(--paper)}
  .tri{padding:22px 22px 18px;border-right:1px solid var(--rule-2)}

  .tri svg.dragging{cursor:grabbing}
  .tri .cap{font-size:14.5px;color:var(--mute);margin:10px 2px 0;line-height:1.45}
  .tri .cap b{font-weight:500;color:var(--ink-2)}
  .panel{padding:22px 24px 20px;display:flex;flex-direction:column;gap:18px}
  .sliders{display:grid;gap:14px}
  .sl label{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--ink-2);gap:10px}
  .sl label .v{font-family:var(--mono);font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}

  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);cursor:pointer}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--slate-soft),0 0 0 5px var(--slate)}
  input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--slate-soft),0 0 0 5px var(--slate)}
  .tau-track{position:relative;height:6px;margin-top:-4px}

  button.pre{font-family:var(--serif);font-size:15px;background:transparent;color:var(--ink);border:1px solid var(--rule-2);padding:5px 11px;border-radius:2px;cursor:pointer;line-height:1.2}

  button.pre:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
  button.pre[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .read{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;border-top:1px solid var(--rule);padding-top:12px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:15px}
  .kv .k{color:var(--ink-2)}
  .kv .v{font-family:var(--mono);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}

  .verdict{grid-column:1/-1;font-size:17px;line-height:1.45;padding:14px 0 2px;color:var(--ink)}

  .verdict .ok{color:var(--slate)}

  /* row 2 */
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--rule-2);border-top:0}

  .tick{height:26px;background:var(--paper-2);border:1px solid var(--rule);font-family:var(--mono);font-size:9.5px;color:var(--mute);display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;position:relative}
  .tick.hit{background:var(--red);border-color:var(--red);color:var(--paper)}
  .tick.near{background:var(--slate-soft);border-color:var(--slate);color:var(--slate)}
  .tick.cur::after{content:"";position:absolute;left:-1px;right:-1px;top:-5px;height:2px;background:var(--ink)}
  .key{font-size:13.5px;color:var(--mute);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
  .key i{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:6px;border:1px solid var(--rule)}

  /* conditioning */
  .cond{border:1px solid var(--rule-2);border-top:0;padding:20px 22px 18px}
  .cond .head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap}
  .bigs{display:flex;gap:34px;flex-wrap:wrap}
  .big{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .big .l{display:block;font-family:var(--serif);font-size:14.5px;color:var(--mute);margin-bottom:6px}
  .big .n{font-size:30px;font-weight:500;line-height:1}
  .big .n.slate{color:var(--slate)} .big .n.moss{color:var(--moss)}
  .big .t{display:block;font-family:var(--serif);font-size:13.5px;color:var(--mute);margin-top:6px}
  .cond .charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;margin-top:16px}
  .cond svg{width:100%;height:auto;display:block}
  .cond .cap{font-size:14.5px;color:var(--mute);margin:8px 0 0;line-height:1.45}
  .cond .cap b{color:var(--ink-2);font-weight:500}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--mute);margin-top:8px}
  .legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
  .check{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:14.5px;color:var(--ink-2);margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
  .check button{font-family:var(--serif);font-size:15px;background:transparent;border:1px solid var(--ink);color:var(--ink);padding:5px 12px;border-radius:2px;cursor:pointer}
  .check button:hover{background:var(--ink);color:var(--paper)}
  .check button:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
  .check output{font-family:var(--mono);font-size:13.5px;color:var(--ink)}

  /* reading */
  .reading{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:56px;margin-top:64px}
  .reading p{margin:0 0 18px;font-size:18.5px;line-height:1.55;color:var(--ink);font-weight:400}
  .reading p b{font-weight:500}
  .reading p .f{font-family:var(--mono);font-size:15px;color:var(--ink-2);white-space:nowrap}
  .reading h3{font-family:var(--serif);font-weight:400;font-size:25px;margin:34px 0 14px;letter-spacing:-.01em;line-height:1.2}
  .reading h3:first-child{margin-top:0}
  .status{border-left:2px solid var(--rule-2);padding-left:18px;font-size:15.5px;color:var(--ink-2);line-height:1.5}
  .status h4{margin:0 0 10px;font-weight:500;font-size:16px;color:var(--ink)}
  .status dl{margin:0}
  .status dt{font-weight:500;color:var(--ink);margin-top:12px}
  .status dt span{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:2px;margin-right:6px;font-family:var(--mono);vertical-align:1px}
  .status dt .proved{background:var(--slate);color:var(--paper)}
  .status dt .live{background:var(--moss);color:var(--paper)}
  .status dt .not{background:transparent;color:var(--red);border:1px solid var(--red)}
  .status dd{margin:4px 0 0}
  footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--rule);font-size:14.5px;color:var(--mute);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  /* svg theme classes */
  .s-ink{stroke:var(--ink)} .s-slate{stroke:var(--slate)} .s-red{stroke:var(--red)} .s-moss{stroke:var(--moss)} .s-rule{stroke:var(--rule)} .s-mute{stroke:var(--mute)} .s-paper{stroke:var(--paper)}
  .f-ink{fill:var(--ink)} .f-ink2{fill:var(--ink-2)} .f-mute{fill:var(--mute)} .f-slate{fill:var(--slate)} .f-red{fill:var(--red)} .f-moss{fill:var(--moss)} .f-paper{fill:var(--paper)} .f-paper2{fill:var(--paper-2)} .f-slatesoft{fill:var(--slate-soft)}
  .t-serif{font-family:var(--serif)} .t-mono{font-family:var(--mono)}

  @media (max-width:980px){
    .hero{grid-template-columns:1fr;gap:22px}
    .inst{grid-template-columns:1fr}
    .tri{border-right:0;border-bottom:1px solid var(--rule-2)}
    .row2{grid-template-columns:1fr}
    .cell + .cell{border-left:0;border-top:1px solid var(--rule-2)}
    .cond .charts{grid-template-columns:1fr}
    .reading{grid-template-columns:1fr;gap:28px}
  }
  @media (max-width:560px){
    .mast{align-items:flex-start;flex-wrap:wrap}
    .mast .crumb{order:3;flex-basis:100%}
    .mast-actions{margin-left:0;width:100%;flex-wrap:wrap}
    .read{grid-template-columns:1fr}
    .reading > *{min-width:0}
    .reading p .f{white-space:normal;overflow-wrap:anywhere}
    body{font-size:17px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="wrap">

"use strict";
const $=id=>document.getElementById(id);
const PI=Math.PI;

/* ============================================================
   LEXICON — every string that differs between the two modes.
   Numbers never change; only the words around them do.
   ============================================================ */
const L={
paper:{

  reading:`
<h3>What you are dragging</h3>
<p>Take the correlation matrix of an AR(1) process, <span class="f">T<sub>N</sub>(a) = [a<sup>|i−j|</sup>]</span>, and subtract a constant τ from the diagonal. For which N is τ an exact eigenvalue, and how close does the finite spectrum come when it misses? The inverse of T<sub>N</sub> is tridiagonal, so the determinant of the shifted matrix is a three-term recurrence, and a three-term recurrence with constant coefficients is a sine: <span class="f">det B<sub>N</sub> = (−1)<sup>N+1</sup> a<sup>N</sup> τ<sup>N−1</sup> sin π(Nα−β) / sin πα</span>. An N×N determinant collapses to one wave.</p>
<p>The wave has a rhythm and a phase. The rhythm α is the crossing angle where the symbol μ<sub>a</sub>(θ) equals τ, divided by π. The phase β comes from the boundary argument of the Blaschke factor (z−a)/(1−az) at that angle. The pair (a, τ) determines (α, β) and the map inverts in closed form, which is why the triangle above is not a sketch but a chart: <span class="f">τ = sin πβ / sin πα</span>, <span class="f">a = cos ½π(α+β) / cos ½π(α−β)</span>.</p>
<p>Singularity is <span class="f">Nα − β ∈ ℤ</span>, a family of straight lines in the triangle. From that one line of algebra the classification falls out. If α is rational, p/q, then either qβ is an integer and the matrix is singular on exactly one residue class of N forever, or it isn't and the matrix is never singular despite a rational angle. If α is irrational, at most one N can ever be singular. So the number of singular dimensions is <b>0, 1, or ∞</b>, all three behaviors are dense in the triangle, and almost every point has none.</p>
<h3>Why the hollow matrix looked special</h3>
<p>Set τ = 1 and the phase locks to the rhythm: β = α. That diagonal is the N = 1 member of the singularity web, which is literal, since T<sub>1</sub> − 1 = [0]. On it the residual becomes ‖(N−1)α‖, the inhomogeneous problem collapses to ordinary rational approximation, and Hurwitz's theorem makes the golden rhythm the best-protected point. Every result of the earlier hollow-matrix paper is this diagonal read off the general chart.</p>
<p>Off the diagonal the phase is a second arithmetic coordinate and the golden protection is gone. For a fixed irrational rhythm and almost every phase, the residual falls below c/N infinitely often for every c, so κ₂ has growth exponent 2 with no O(N²) envelope at all. The page cannot show you that theorem; it is a statement about almost every β and no finite sweep exhibits it. What it can show is the mechanism: the residual, the web, and the collapse on the resonant line.</p>
<h3>The number that matters</h3>
<p>Inside the band the matrix is indefinite, so the eigenvalue nearest zero is the smallest singular value, and the theorem gives it exactly to leading order: <span class="f">σ<sub>min</sub> = π γ(a,τ) d<sub>N</sub>/(N+τ)</span>, where γ is the slope of the symbol at the crossing and N+τ is the angular derivative of z<sup>N</sup>(z−a)/(1−az). Divide the band width by that and you have κ₂. For irrational α the residual equidistributes, so κ₂/N follows a Pareto law with tail index 1: a heavy tail whose mean diverges. At the two band edges the slope γ vanishes and the law turns quadratic in N with explicit constants. Outside the band there is nothing to approach and the condition number is bounded.</p>`,

  reading:`
<h3>What you are dragging</h3>
<p>Put N chairs in a row. Chair i hears chair j at a volume that fades by a factor <span class="f">a</span> for every chair between them; every chair hears itself at volume 1. That grid is the <b>echo table</b>. Now turn every chair's own volume down by the same amount τ. Feed the machine a list of N numbers and each chair adds up what it hears. The machine is <b>blind</b> if some non-zero list comes out as all zeros.</p>
<p>There's one number that says whether the machine is blind (mathematicians call it the determinant), and for this machine the paper proves it collapses to a single wave: <span class="f">sin π(Nα − β)</span> times things that are never zero. A sine is zero only at whole numbers, so the machine is blind exactly when <span class="f">Nα − β</span> is a whole number. That's a clock. A hand jumps a <b>stride</b> of α turns every tick; a <b>target</b> is painted at β; the machine with N chairs is blind exactly when the hand lands on the target at tick N. Both numbers come from the fade and the turn-down, and you can go backwards too: <span class="f">τ = sin πβ / sin πα</span>, <span class="f">a = cos ½π(α+β) / cos ½π(α−β)</span>. That's why the triangle is a map and not a sketch.</p>
<p>If the stride is a fraction p/q, the hand leaves q <b>footprints</b> and walks them again forever. Either the target is on a footprint, and the machine is blind every q-th chair-count forever, or it's between footprints, and the machine is never blind even though the hand keeps repeating. If the stride is not a fraction, the hand never revisits a spot, so it can land on the target at most once, and on a randomly painted target, never. So the number of blind chair-counts is <b>0, 1, or forever</b>, and the paper proves all three kinds are found in every corner of the map.</p>
<h3>Why the hollow table looked special</h3>
<p>Turn every chair down by exactly 1 and each chair's own volume becomes zero. On the map that's the line β = α: the target is painted on the hand's <b>first footprint</b>, the starting line. The one-chair hollow machine is blind for free (it's the number 0). And the near-miss at tick N is just how close the hand came back to where it started, which is a two-hundred-year-old question with a known answer: the <b>stubborn stride</b> 1/φ² ≈ 0.382 stays away from whole turns longest of any number. So the first paper found that this stride makes the hollow machine's worst case as gentle as it can be.</p>
<p>It was the safest fade on one road. Step off the starting line and the target is a second, independent number. The paper uses a theorem (Kim, 2007) that says: pick any non-repeating stride, then paint the target by throwing a dart. With probability one, the hand will come closer to that target than <i>any</i> rule c/N you name, infinitely often. No stride protects you. The page can't show you that, because it's a statement about every chair-count at once, and no finite sweep exhibits it. What it can show is the machinery: the near-miss, the blind lines, and the collapse on the starting line.</p>
<h3>The number that matters</h3>
<p><b>Touchiness</b> is what you pay when the machine isn't blind but nearly is: if your output is off by 1%, the input you recover can be off by κ%. The paper gives the closest approach to blind exactly, to leading order: <span class="f">π × (steepness of the dial) × (near-miss) ÷ (N + τ)</span>. Divide the dial's width by that and touchiness is a constant times (N + τ) divided by the near-miss. For a non-repeating stride, touchiness ÷ N behaves like a <b>lottery</b>: usually small, sometimes enormous, and the enormous ones are so enormous that the average never settles. At either end of the dial the dial goes flat, steepness hits zero, and the law becomes N² with an exact constant. Off the dial there's nothing to hit and touchiness stays put.</p>`,

/* ============================================================ math */
const mu=(a,t)=>(1-a*a)/(1-2*a*Math.cos(t)+a*a);
const psi=(a,t)=>Math.atan2((1-a*a)*Math.sin(t),(1+a*a)*Math.cos(t)-2*a);
const muMinus=a=>(1-a)/(1+a), muPlus=a=>(1+a)/(1-a);
const distZ=x=>Math.abs(x-Math.round(x));
function coords(a,tau){const c=(1+a*a-(1-a*a)/tau)/(2*a);const th=Math.acos(Math.max(-1,Math.min(1,c)));return {alpha:th/PI,beta:1-psi(a,th)/PI,theta:th};}
function inverse(al,be){return {a:Math.cos(PI/2*(al+be))/Math.cos(PI/2*(al-be)),tau:Math.sin(PI*be)/Math.sin(PI*al)};}
function eigenangles(N,a){const out=new Array(N);let lo=0;for(let k=1;k<=N;k++){const target=k*PI;let Lo=lo,R=PI;for(let i=0;i<48;i++){const m=0.5*(Lo+R);if(N*m+psi(a,m)<target)Lo=m;else R=m;}out[k-1]=0.5*(Lo+R);lo=out[k-1];}return out;}
function spectrum(N,a,tau){const th=eigenangles(N,a);const ev=new Array(N);for(let i=0;i<N;i++)ev[i]=mu(a,th[i])-tau;return ev;}
function kappaOf(ev){let mx=0,mn=Infinity;for(const e of ev){const m=Math.abs(e);if(m>mx)mx=m;if(m<mn)mn=m;}return {mx,mn,k:mn>1e-15?mx/mn:Infinity};}
function continuedFraction(x,maxTerms=14){const t=[];let v=x;for(let i=0;i<maxTerms;i++){const q=Math.floor(v+1e-12);t.push(q);const f=v-q;if(f<1e-11)return {terms:t,term:true};v=1/f;}return {terms:t,term:false};}
function rationalOf(x,qmax=60,tol=1e-9){const {terms}=continuedFraction(x,16);let p0=1,p1=terms[0],q0=0,q1=1;if(Math.abs(x-p1)<tol)return {p:p1,q:1};for(let i=1;i<terms.length;i++){const p=terms[i]*p1+p0,q=terms[i]*q1+q0;if(q>qmax)break;if(Math.abs(x-p/q)<tol)return {p,q};p0=p1;p1=p;q0=q1;q1=q;}return null;}
function jacobiEig(M){const n=M.length,A=M.map(r=>r.slice());for(let sweep=0;sweep<80;sweep++){let off=0;for(let p=0;p<n-1;p++)for(let q=p+1;q<n;q++)off+=A[p][q]*A[p][q];if(off<1e-26)break;for(let p=0;p<n-1;p++)for(let q=p+1;q<n;q++){if(Math.abs(A[p][q])<1e-300)continue;const th=(A[q][q]-A[p][p])/(2*A[p][q]);const t=Math.sign(th||1)/(Math.abs(th)+Math.sqrt(th*th+1));const c=1/Math.sqrt(t*t+1),s=t*c;for(let k=0;k<n;k++){const akp=A[k][p],akq=A[k][q];A[k][p]=c*akp-s*akq;A[k][q]=s*akp+c*akq;}for(let k=0;k<n;k++){const apk=A[p][k],aqk=A[q][k];A[p][k]=c*apk-s*aqk;A[q][k]=s*apk+c*aqk;}}}return Array.from({length:n},(_,i)=>A[i][i]).sort((x,y)=>x-y);}
const gammaOf=(a,tau,al)=>2*a*tau*tau*Math.sin(PI*al)/(1-a*a);
const big=x=>!isFinite(x)?"—":x>=1e6?x.toExponential(2):x>=100?Math.round(x).toLocaleString():x.toFixed(2);
const sup=p=>String(p).replace(/-/g,"⁻").replace(/\d/g,d=>"⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
const fmt=(x,d=5)=>Number.isFinite(x)?x.toFixed(d):"—";

/* ============================================================ state */
const aEl=$("a"),tEl=$("tau"),nEl=$("n");
const S={a:0.5,tau:1.0,N:40,exact:null};
const tauFromT=(a,t)=>muMinus(a)+t*(muPlus(a)-muMinus(a));
const tFromTau=(a,tau)=>(tau-muMinus(a))/(muPlus(a)-muMinus(a));
function setFromSliders(){S.a=parseFloat(aEl.value);S.tau=tauFromT(S.a,parseFloat(tEl.value));S.N=parseInt(nEl.value);}
function pushToSliders(){aEl.value=S.a.toFixed(4);tEl.value=Math.max(-0.3,Math.min(1.3,tFromTau(S.a,S.tau))).toFixed(4);nEl.value=S.N;}
function regimeOf(a,tau){const lo=muMinus(a),hi=muPlus(a),eps=1e-9;if(Math.abs(tau-lo)<eps)return "lower edge";if(Math.abs(tau-hi)<eps)return "upper edge";if(tau<lo)return "below";if(tau>hi)return "above";return "interior";}

const PRESETS={
  "hollow-gold":()=>{const al=1-2/(1+Math.sqrt(5));return {alpha:al,beta:al,N:56};},
  "recur":()=>({alpha:1/5,beta:3/5,N:23}),
  "incompat":()=>({alpha:1/3,beta:1/2,N:40}),
  "once":()=>{const c=coords(0.5,1.5);return {alpha:c.alpha,beta:c.beta,N:2};},
  "edge":()=>({a:0.5,tau:muPlus(0.5),N:120}),
  "outside":()=>({a:0.5,tau:muPlus(0.5)+0.6,N:80}),
};
let activePreset=null;
document.querySelectorAll("button.pre").forEach(b=>b.addEventListener("click",()=>{
  const p=PRESETS[b.dataset.p]();
  if(p.alpha!==undefined){const inv=inverse(p.alpha,p.beta);S.a=inv.a;S.tau=inv.tau;S.exact={alpha:p.alpha,beta:p.beta};}
  else{S.a=p.a;S.tau=p.tau;S.exact=null;}
  S.N=p.N;activePreset=b.dataset.p;pushToSliders();render();
}));
const clearPreset=()=>{activePreset=null;S.exact=null;};

/* ============================================================ triangle */
const TW=560,TH=500,tx0=52,ty0=452,tsc=396;
const TX=al=>tx0+al*tsc,TY=be=>ty0-be*tsc;
function railPath(a){let d="";const lo=muMinus(a),hi=muPlus(a);for(let i=1;i<=199;i++){const tau=lo+(hi-lo)*i/200;const c=coords(a,tau);d+=(i===1?"M":"L")+TX(c.alpha).toFixed(1)+" "+TY(c.beta).toFixed(1);}return d;}
function drawTriangle(al,be,N,inside){
  const svg=$("tri");let s="";
  const tri=`${TX(0)},${TY(0)} ${TX(1)},${TY(0)} ${TX(0)},${TY(1)}`;
  s+=`<polygon points="${tri}" class="f-paper2 s-ink" stroke-width="1.2"/>`;
  s+=`<clipPath id="clipT"><polygon points="${tri}"/></clipPath><g clip-path="url(#clipT)">`;
  const drawN=new Set([2,3,4,5,6,7,8,9]);if(inside)drawN.add(N);
  for(const n of [...drawN].sort((x,y)=>x-y)){const cur=(n===N&&inside);
    for(let m=0;m<=n;m++){const a0=m/n,a1=(m+1)/(n+1);if(a1<=0||a0>=1)continue;
      s+=`<line x1="${TX(a0)}" y1="${TY(0)}" x2="${TX(a1)}" y2="${TY(1-a1)}" class="${cur?'s-red':'s-slate'}" stroke-width="${cur?1.6:0.6}" stroke-opacity="${cur?1:0.22+0.05*(9-n)}"/>`;}}
  s+=`<line x1="${TX(0)}" y1="${TY(0)}" x2="${TX(0.5)}" y2="${TY(0.5)}" class="s-red" stroke-width="1.2" stroke-dasharray="5 4"/>`;
  s+=`<path d="${railPath(S.a)}" fill="none" class="s-slate" stroke-width="1" stroke-opacity=".7"/></g>`;
  s+=`<text x="${TX(0.5)}" y="${ty0+34}" class="t-serif f-ink2" font-size="17" text-anchor="middle">${T("ax_alpha")}</text>`;
  s+=`<text x="${tx0-30}" y="${TY(0.5)}" class="t-serif f-ink2" font-size="17" text-anchor="middle" transform="rotate(-90 ${tx0-30} ${TY(0.5)})">${T("ax_beta")}</text>`;
  s+=`<text x="${TX(0)-6}" y="${ty0+16}" class="t-mono f-mute" font-size="11" text-anchor="end">0</text>`;
  s+=`<text x="${TX(1)}" y="${ty0+16}" class="t-mono f-mute" font-size="11" text-anchor="middle">1</text>`;
  s+=`<text x="${TX(0)-8}" y="${TY(1)+4}" class="t-mono f-mute" font-size="11" text-anchor="end">1</text>`;
  s+=`<text x="${TX(0.60)}" y="${TY(0.44)}" class="t-serif f-mute" font-style="italic" font-size="14" transform="rotate(-45 ${TX(0.60)} ${TY(0.44)})">${T("hyp")}</text>`;
  s+=`<text x="${TX(0.30)}" y="${TY(0.315)}" class="t-serif f-red" font-style="italic" font-size="14" transform="rotate(-45 ${TX(0.30)} ${TY(0.315)})">${T("diag")}</text>`;
  s+=`<text x="${TX(0)+8}" y="${TY(1)-10}" class="t-serif f-mute" font-style="italic" font-size="13">${T("top")}</text>`;
  s+=`<text x="${TX(1)}" y="${TY(0)-10}" class="t-serif f-mute" font-style="italic" font-size="13" text-anchor="end">${T("right")}</text>`;
  s+=`<text x="${TX(0)+8}" y="${TY(0)-8}" class="t-serif f-mute" font-style="italic" font-size="13">${T("legs")}</text>`;
  if(inside){s+=`<circle cx="${TX(al)}" cy="${TY(be)}" r="16" class="f-slatesoft"/><circle cx="${TX(al)}" cy="${TY(be)}" r="6" class="f-slate s-paper" stroke-width="2"/>`;}
  else{s+=`<text x="${TX(0.52)}" y="${TY(0.62)}" class="t-serif f-ink2" font-size="16" text-anchor="middle">${T("out1")}</text><text x="${TX(0.52)}" y="${TY(0.62)+22}" class="t-serif f-ink2" font-size="16" text-anchor="middle">${T("out2")}</text>`;}
  svg.innerHTML=s;
}
(function(){const svg=$("tri");let drag=false;
  const toAB=e=>{const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)*TW/r.width,y=(e.clientY-r.top)*TH/r.height;let al=(x-tx0)/tsc,be=(ty0-y)/tsc;const m=0.012;al=Math.max(m,al);be=Math.max(m,be);if(al+be>1-m){const ex=al+be-(1-m);al-=ex/2;be-=ex/2;}return {al,be};};
  const apply=({al,be})=>{const inv=inverse(al,be);S.a=Math.min(0.98,Math.max(0.02,inv.a));S.tau=inv.tau;clearPreset();pushToSliders();render();};
  svg.addEventListener("pointerdown",e=>{drag=true;svg.classList.add("dragging");svg.setPointerCapture(e.pointerId);apply(toAB(e));});
  svg.addEventListener("pointermove",e=>{if(drag)apply(toAB(e));});
  const up=()=>{drag=false;svg.classList.remove("dragging");};
  svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
})();

/* ============================================================ spectrum */
function drawSpec(ev,a,tau){
  const W=560,pad=26,mid=62;const lo=muMinus(a)-tau,hi=muPlus(a)-tau;const X=v=>pad+(v-lo)/(hi-lo)*(W-2*pad);let s="";
  s+=`<rect x="${X(lo)}" y="${mid-4}" width="${X(hi)-X(lo)}" height="8" class="f-paper2"/>`;
  const z=X(0);if(z>=pad-1&&z<=W-pad+1){s+=`<line x1="${z}" y1="14" x2="${z}" y2="${mid+30}" class="s-ink" stroke-width="1" stroke-dasharray="2 3"/><text x="${z}" y="10" class="t-mono f-ink2" font-size="11" text-anchor="middle">0</text>`;}
  s+=`<text x="${X(lo)}" y="${mid+30}" class="t-mono f-mute" font-size="10.5" text-anchor="middle">${T("spec_lo")(lo.toFixed(3))}</text>`;
  s+=`<text x="${X(hi)}" y="${mid+30}" class="t-mono f-mute" font-size="10.5" text-anchor="middle">${T("spec_hi")(hi.toFixed(3))}</text>`;
  let mn=Infinity,mi=-1;ev.forEach((e,i)=>{if(Math.abs(e)<mn){mn=Math.abs(e);mi=i;}});
  const hitc=mn<1e-8?"f-red":"f-slate",hits=mn<1e-8?"s-red":"s-slate";
  ev.forEach((e,i)=>{const isMin=i===mi;s+=`<circle cx="${X(e)}" cy="${mid}" r="${isMin?5:2.6}" class="${isMin?hitc:'f-mute'}" opacity="${isMin?1:.8}"/>`;});
  if(mi>=0){const e=ev[mi];s+=`<circle cx="${X(e)}" cy="${mid}" r="11" fill="none" class="${hits}" stroke-width="1"/><text x="${Math.min(W-70,Math.max(70,X(e)))}" y="${mid-18}" class="t-mono ${hitc}" font-size="11.5" text-anchor="middle">${T("spec_near")} ${mn<1e-3?mn.toExponential(2):mn.toFixed(4)}</text>`;}
  $("spec").innerHTML=s;
}

/* ============================================================ ladder */
// A red marker is a finite-precision near-hit, not an exact singularity test.
const hitAt=(N,al,be)=>distZ(N*al-be)<1e-7;
function drawLadder(al,be,N,inside,arat){
  let s="";const near=new Set();
  if(inside&&!arat){let best=Infinity;for(let n=2;n<=60;n++){const d=distZ(n*al-be);if(d<best*0.75){best=d;near.add(n);}}near.delete(2);}
  for(let n=2;n<=60;n++){let cls="tick";if(inside&&hitAt(n,al,be))cls+=" hit";else if(near.has(n))cls+=" near";if(n===N)cls+=" cur";
    const show=(n%10===0||cls.includes("hit")||cls.includes("near"))?n:"";
    s+=`<div class="${cls}" title="N=${n}${inside?', d='+distZ(n*al-be).toFixed(4):''}">${show}</div>`;}
  $("ladder").innerHTML=s;
  $("key").innerHTML=!inside?`<span>${T("key_out")}</span>`
    :`<span><i style="background:var(--red);border-color:var(--red)"></i>${T("key_hit")}</span><span><i style="background:var(--slate-soft);border-color:var(--slate)"></i>${T("key_near")}</span><span><i style="background:transparent;border-color:var(--ink)"></i>${T("key_cur")}</span>`;
}

/* ============================================================ kappa vs N */
let kNtimer=null;const scheduleKN=()=>{if(kNtimer)clearTimeout(kNtimer);kNtimer=setTimeout(drawKN,60);};
function drawKN(){
  const a=S.a,tau=S.tau,reg=regimeOf(a,tau),inside=reg==="interior";const NMAX=240;const W=560,H=200,pl=44,pr=12,pt=14,pb=26;
  const ks=[],preds=[],hits=[];let C=null,al=0,be=0;
  if(inside){const c=S.exact||coords(a,tau);al=c.alpha;be=c.beta;const g=gammaOf(a,tau,al);const M=Math.max(muPlus(a)-tau,tau-muMinus(a));C=M/(PI*g);}
  let kmax=1,kmin=Infinity;
  for(let n=2;n<=NMAX;n++){const {k}=kappaOf(spectrum(n,a,tau));const isHit=inside&&hitAt(n,al,be);if(isHit)hits.push(n);
    const kv=isFinite(k)?k:NaN;ks.push(kv);
    if(inside){const d=distZ(n*al-be);preds.push(d>1e-12?C*(n+tau)/d:NaN);}else preds.push(NaN);
    if(isFinite(kv)){kmax=Math.max(kmax,kv);kmin=Math.min(kmin,kv);}}
  const lgMin=Math.floor(Math.log10(Math.max(kmin,1))),lgMax=Math.ceil(Math.log10(kmax*1.3));
  const X=n=>pl+(n-2)/(NMAX-2)*(W-pl-pr),Y=k=>pt+(1-(Math.log10(k)-lgMin)/(lgMax-lgMin))*(H-pt-pb);
  let s="";
  for(let p=lgMin;p<=lgMax;p++){const y=Y(Math.pow(10,p));s+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" class="s-rule"/><text x="${pl-6}" y="${y+4}" class="t-mono f-mute" font-size="10" text-anchor="end">10${sup(p)}</text>`;}
  for(const n of [50,100,150,200,240])s+=`<text x="${X(n)}" y="${H-8}" class="t-mono f-mute" font-size="10" text-anchor="middle">${n}</text>`;
  s+=`<text x="${W-pr}" y="${H-8}" class="t-serif f-mute" font-size="12" text-anchor="end">N</text>`;
  const path=(arr,cls,w,extra="")=>{let d="",pen=false;arr.forEach((v,i)=>{if(!isFinite(v)||v>Math.pow(10,lgMax)){pen=false;return;}d+=(pen?"L":"M")+X(i+2).toFixed(1)+" "+Y(v).toFixed(1);pen=true;});return `<path d="${d}" fill="none" class="${cls}" stroke-width="${w}" ${extra}/>`;};
  if(inside)s+=path(preds,"s-moss",1.1,'stroke-opacity=".8"');
  s+=path(ks.map(k=>isFinite(k)?Math.min(k,Math.pow(10,lgMax)):NaN),"s-slate",1.4);
  for(const n of hits)s+=`<line x1="${X(n)}" y1="${pt}" x2="${X(n)}" y2="${H-pb}" class="s-red" stroke-width="1" stroke-dasharray="2 3"/>`;
  s+=`<line x1="${X(S.N)}" y1="${pt}" x2="${X(S.N)}" y2="${H-pb}" class="s-ink" stroke-width="1" stroke-opacity=".5"/>`;
  if(!inside){const lim=reg==="below"?(muPlus(a)-tau)/(muMinus(a)-tau):reg==="above"?(tau-muMinus(a))/(tau-muPlus(a)):null;
    if(lim){s+=`<line x1="${pl}" y1="${Y(lim)}" x2="${W-pr}" y2="${Y(lim)}" class="s-moss" stroke-width="1" stroke-dasharray="4 3"/><text x="${W-pr-4}" y="${Y(lim)-5}" class="t-mono f-moss" font-size="10.5" text-anchor="end">${T("limit")(lim.toFixed(3))}</text>`;}
    else{const upper=reg==="upper edge";const K=upper?4*muMinus(a)**2/(PI*PI):4*muPlus(a)**2/(PI*PI);let d="";for(let n=2;n<=NMAX;n++){const v=K*(n+tau)**2;d+=(n===2?"M":"L")+X(n).toFixed(1)+" "+Y(v).toFixed(1);}
      s+=`<path d="${d}" fill="none" class="s-moss" stroke-width="1.1" stroke-dasharray="4 3"/><text x="${pl+6}" y="${pt+12}" class="t-mono f-moss" font-size="10.5">4μ${upper?'₋':'₊'}²/π² · (N+τ)²</text>`;}}
  $("kN").innerHTML=s;
}

/* ============================================================ kappa vs tau */
let kTtimer=null,kTcache={a:null,data:null};const scheduleKT=()=>{if(kTtimer)clearTimeout(kTtimer);kTtimer=setTimeout(drawKT,80);};
function drawKT(){
  const a=S.a,Ns=100;$("nsweep").textContent=Ns;
  const lo=muMinus(a),hi=muPlus(a),Wb=hi-lo,t0=lo-0.32*Wb,t1=hi+0.32*Wb,M=360;
  if(kTcache.a!==a){const th=eigenangles(Ns,a);const mus=th.map(t=>mu(a,t));const data=[];for(let i=0;i<=M;i++){const tau=t0+(t1-t0)*i/M;let mx=0,mn=Infinity;for(const m of mus){const v=Math.abs(m-tau);if(v>mx)mx=v;if(v<mn)mn=v;}data.push({tau,k:mn>1e-15?mx/mn:Infinity});}kTcache={a,data};}
  const data=kTcache.data;const W=560,H=200,pl=44,pr=12,pt=14,pb=26;
  let kmax=1;for(const d of data)if(isFinite(d.k))kmax=Math.max(kmax,d.k);
  const lgMin=0,lgMax=Math.ceil(Math.log10(kmax*1.2));
  const X=tau=>pl+(tau-t0)/(t1-t0)*(W-pl-pr),Y=k=>pt+(1-(Math.log10(Math.max(k,1))-lgMin)/(lgMax-lgMin))*(H-pt-pb);
  let s=`<rect x="${X(lo)}" y="${pt}" width="${X(hi)-X(lo)}" height="${H-pt-pb}" class="f-paper2"/>`;
  for(let p=lgMin;p<=lgMax;p++){const y=Y(Math.pow(10,p));s+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" class="s-rule"/><text x="${pl-6}" y="${y+4}" class="t-mono f-mute" font-size="10" text-anchor="end">10${sup(p)}</text>`;}
  if(1>t0&&1<t1)s+=`<line x1="${X(1)}" y1="${pt}" x2="${X(1)}" y2="${H-pb}" class="s-red" stroke-width="1" stroke-dasharray="4 3"/>`;
  let d="",pen=false;for(const q of data){if(!isFinite(q.k)){pen=false;continue;}d+=(pen?"L":"M")+X(q.tau).toFixed(1)+" "+Y(Math.min(q.k,Math.pow(10,lgMax))).toFixed(1);pen=true;}
  s+=`<path d="${d}" fill="none" class="s-slate" stroke-width="1.2"/>`;
  s+=`<line x1="${X(S.tau)}" y1="${pt}" x2="${X(S.tau)}" y2="${H-pb}" class="s-ink" stroke-width="1.4"/>`;
  s+=`<text x="${X(lo)}" y="${H-8}" class="t-mono f-mute" font-size="10" text-anchor="middle">${T("kT_lo")(lo.toFixed(3))}</text>`;
  s+=`<text x="${X(hi)}" y="${H-8}" class="t-mono f-mute" font-size="10" text-anchor="middle">${T("kT_hi")(hi.toFixed(3))}</text>`;
  s+=`<text x="${W-pr}" y="${H-8}" class="t-serif f-mute" font-size="12" text-anchor="end">τ</text>`;
  $("kT").innerHTML=s;
}

/* ============================================================ tau track */
function drawTauTrack(){
  const tr=$("tautrack");const pct=t=>((t+0.3)/1.6*100).toFixed(2)+"%";const one=tFromTau(S.a,1);const showOne=one>-0.3&&one<1.3;
  tr.innerHTML=`<div class="band" style="left:${pct(0)};width:${(1/1.6*100).toFixed(2)}%"></div>`+(showOne?`<div class="one" style="left:${pct(one)}"></div>`:"")
    +`<div class="lab" style="left:${pct(0)}">${T("track_lo")}</div><div class="lab" style="left:${pct(1)}">${T("track_hi")}</div>`+(showOne?`<div class="lab" style="left:${pct(one)};color:var(--red)">${T("track_one")}</div>`:"");
}

/* ============================================================ render */
function render(){
  const a=S.a,tau=S.tau,N=S.N;const reg=regimeOf(a,tau);const inside=reg==="interior";
  $("aval").textContent=a.toFixed(4);
  $("tauval").innerHTML=tau.toFixed(4)+`<small>${T("reg")[reg]}</small>`;
  $("nval").textContent=N;
  $("band").textContent=`[${muMinus(a).toFixed(4)}, ${muPlus(a).toFixed(4)}]`;
  $("regime").textContent=T("regv")[reg];
  drawTauTrack();
  document.querySelectorAll("button.pre").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===activePreset?"true":"false"));
  let al=NaN,be=NaN,arat=null,compat=null;
  if(inside){const c=S.exact||coords(a,tau);al=c.alpha;be=c.beta;arat=rationalOf(al);if(arat){const qb=arat.q*be;compat=Math.abs(qb-Math.round(qb))<1e-7?Math.round(qb):null;}}
  drawTriangle(al,be,N,inside);
  const ev=spectrum(N,a,tau);const {mx,mn,k}=kappaOf(ev);
  drawSpec(ev,a,tau);
  if(inside){
    const dN=distZ(N*al-be);const hit=dN<1e-7; // numerical near-hit only; never a proof of exact singularity
    const det=Math.pow(-1,N+1)*Math.pow(a,N)*Math.pow(tau,N-1)*Math.sin(PI*(N*al-be))/Math.sin(PI*al);
    $("alpha").textContent=fmt(al,6)+(arat?`  ≈ ${arat.p}/${arat.q}`:"");
    $("beta").textContent=fmt(be,6)+(arat&&compat!==null?`  ≈ ${compat}/${arat.q}`:"");
    $("arat").innerHTML=arat?T("arat_yes")(arat.q):T("arat_no");
    $("compat").innerHTML=arat?(compat!==null?T("compat_yes")(arat.q,compat):T("compat_no")(arat.q,arat.q*be)):"—";
    $("dn").innerHTML=hit?`<span class="r">${dN.toExponential(2)} (near)</span>`:fmt(dN,6);
    $("det").innerHTML=det.toExponential(3);
    $("nplus").textContent=`${Math.ceil(N*al-be-1e-12)}${hit?"  "+T("nplus_hit"):""}`;
    let ruleTxt;
    if(arat){if(compat!==null){let r0=-1;for(let n=0;n<arat.q;n++)if(((n*arat.p-compat)%arat.q+arat.q)%arat.q===0){r0=n;break;}ruleTxt=T("rule_forever")(r0,arat.q);}else ruleTxt=T("rule_never");}
    else{let found=null;for(let n=2;n<=600;n++)if(hitAt(n,al,be)){found=n;break;}ruleTxt=found?T("rule_once")(found):T("rule_none");}
    $("rule").innerHTML=ruleTxt;
    const g=gammaOf(a,tau,al),M=Math.max(muPlus(a)-tau,tau-muMinus(a)),C=M/(PI*g);
    $("verdict").innerHTML=hit?T("v_hit")({N,d:dN.toExponential(2)}):T("v_miss")({N,d:fmt(dN,4),smin:fmt(PI*g*dN/(N+tau),5)});
    const kp=dN>1e-14?C*(N+tau)/dN:NaN;
    $("kact").textContent=big(k);$("kacttag").textContent=(hit?T("tag_sing")+" · ":"")+T("tag_sig")(mx.toFixed(4),mn<1e-3?mn.toExponential(2):mn.toFixed(5));
    $("kpred").textContent=isFinite(kp)?big(kp):"—";$("kpredtag").textContent=T("tag_C")(C.toFixed(4),g.toFixed(4));
    $("kratio").textContent=(isFinite(k)&&isFinite(kp))?(k/kp).toFixed(4):"—";
    drawLadder(al,be,N,true,arat);
  }else{
    for(const id of ["alpha","beta","arat","compat","dn","det"])$(id).textContent="—";
    $("nplus").textContent=reg==="below"?T("nplus_below")(N):reg==="above"?T("nplus_above"):"—";
    $("rule").textContent=T("rule_out");
    let lim,tag;
    if(reg==="below"){lim=(muPlus(a)-tau)/(muMinus(a)-tau);tag="(μ₊−τ)/(μ₋−τ)";}
    else if(reg==="above"){lim=(tau-muMinus(a))/(tau-muPlus(a));tag="(τ−μ₋)/(τ−μ₊)";}
    else{const upper=reg==="upper edge";lim=(upper?4*muMinus(a)**2:4*muPlus(a)**2)/(PI*PI)*(N+tau)**2;tag=`4μ${upper?'₋':'₊'}²/π² · (N+τ)²`;}
    const isOut=reg==="below"||reg==="above";
    $("verdict").innerHTML=isOut?T("v_out")({reg:T("regv")[reg],tag,lim:lim.toFixed(4)}):T("v_edge")({reg:T("regv")[reg],tag});
    $("kact").textContent=big(k);$("kacttag").textContent=T("tag_sig")(mx.toFixed(4),mn.toFixed(5));
    $("kpred").textContent=big(lim);$("kpredtag").textContent=isOut?T("tag_bound")(tag):tag;
    $("kratio").textContent=(k/lim).toFixed(4);
    drawLadder(al,be,N,false,null);
  }
  scheduleKN();scheduleKT();
}

/* ============================================================ cross-check */
$("xcheck").addEventListener("click",()=>{
  const N=Math.min(S.N,72),a=S.a,tau=S.tau;const Mx=[];
  for(let i=0;i<N;i++){const r=[];for(let j=0;j<N;j++)r.push((i===j?1:Math.pow(a,Math.abs(i-j)))-(i===j?tau:0));Mx.push(r);}
  const t0=performance.now();const j=jacobiEig(Mx);const t1=performance.now();
  const q=spectrum(N,a,tau).slice().sort((x,y)=>x-y);let md=0;for(let i=0;i<N;i++)md=Math.max(md,Math.abs(j[i]-q[i]));
  $("xout").innerHTML=T("xres")({N,capped:S.N>72,md:md.toExponential(2),kj:big(kappaOf(j).k),kq:big(kappaOf(q).k),ms:(t1-t0).toFixed(0)});
});

/* ============================================================ wire */
aEl.addEventListener("input",()=>{const t=parseFloat(tEl.value);S.a=parseFloat(aEl.value);S.tau=tauFromT(S.a,t);S.N=parseInt(nEl.value);clearPreset();render();});
tEl.addEventListener("input",()=>{setFromSliders();clearPreset();render();});
nEl.addEventListener("input",()=>{S.N=parseInt(nEl.value);if(!S.exact)setFromSliders();render();});

applyStatic();
(function(){const p=PRESETS["hollow-gold"]();const inv=inverse(p.alpha,p.beta);S.a=inv.a;S.tau=inv.tau;S.N=p.N;S.exact={alpha:p.alpha,beta:p.beta};activePreset="hollow-gold";pushToSliders();render();})();
</script>
